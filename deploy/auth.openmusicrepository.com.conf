# osap-auth Web + API — auth.openmusicrepository.com
#
# Acceso restringido: solo desde la app (openmusicrepository.com/app) o desde el propio
# servidor (M2M/OSAP interno). Callbacks OAuth y discovery quedan exentos. Bloquea el acceso
# directo/externo a la web y API de auth.
server {
    listen 80;
    listen [::]:80;
    server_name auth.openmusicrepository.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.openmusicrepository.com;

    ssl_certificate /etc/nginx/ssl/auth.openmusicrepository.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/auth.openmusicrepository.com/private.key;

    root /home/ocw/openmusicrepository.com/osap-auth/web/dist;
    index index.html;

    # API de osap-auth (backend 127.0.0.1:8200) bajo el prefijo /auth-api.
    location /auth-api/ {
        set $osap_ok 0;
        if ($http_referer ~* ^https?://(app\.)?openmusicrepository\.com) { set $osap_ok 1; }
        if ($http_origin  ~* ^https?://(app\.)?openmusicrepository\.com)  { set $osap_ok 1; }
        if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
        if ($request_uri ~ "^/auth-api/auth/oauth/") { set $osap_ok 1; }
        if ($request_uri ~ "^/auth-api/\.well-known/") { set $osap_ok 1; }
        if ($osap_ok = 0) { return 403; }

        rewrite ^/auth-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA de auth: solo desde la app.
    location / {
        set $osap_ok 0;
        if ($http_referer ~* ^https?://(app\.)?openmusicrepository\.com) { set $osap_ok 1; }
        if ($http_origin  ~* ^https?://(app\.)?openmusicrepository\.com)  { set $osap_ok 1; }
        if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
        if ($osap_ok = 0) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
