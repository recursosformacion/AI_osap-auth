# osap-auth Web + API — auth.openmusicrepository.com
#
# Acceso restringido: solo desde la app (app/openmusicrepository.com), desde el propio host
# de auth (la SPA de login del popup OIDC, que hace llamadas same-origin a /auth-api) o desde
# el servidor (M2M/OSAP interno). authorize/oauth/discovery quedan exentos. Bloquea el acceso
# directo/externo.
#
# IMPORTANTE: el gate va a NIVEL DE `server` (if + set/return). Si se pone dentro de
# `location /`, nginx deja de aplicar el `try_files` de la SPA y las rutas profundas
# (/auth/login, /auth/register…) devuelven 404 (regresión de 5.3.0).
server {
    listen 80;
    listen [::]:80;
    server_name auth.openmusicrepository.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.openmusicrepository.com;

    ssl_certificate /etc/nginx/ssl/auth.openmusicrepository.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/auth.openmusicrepository.com/private.key;

    root /home/ocw/openmusicrepository.com/osap-auth/web/dist;
    index index.html;

    # --- Gate de acceso (a nivel de server, NO dentro de `location`) ----------
    set $osap_ok 0;
    if ($http_referer ~* ^https?://(app\.|auth\.)?openmusicrepository\.com) { set $osap_ok 1; }
    if ($http_origin  ~* ^https?://(app\.|auth\.)?openmusicrepository\.com)  { set $osap_ok 1; }
    if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
    if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
    if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
    # Endpoints que deben funcionar sin referer de la app (popup OIDC, login social,
    # intercambio de tokens y discovery).
    if ($request_uri ~ "^/auth-api/(auth/(authorize|oauth/)|oauth/|\.well-known/)") { set $osap_ok 1; }
    if ($osap_ok = 0) { return 403; }

    # API de osap-auth (backend 127.0.0.1:8200) bajo el prefijo /auth-api.
    location /auth-api/ {
        rewrite ^/auth-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA de auth: sin `if` en el location -> el try_files (fallback a /index.html) funciona.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
