[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osap-auth"
version = "0.1.0"
description = "Servicio de identidad y autenticacion para OSAP (Auth API v1.0)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Nota: osap-api (para tests de validación de configuración compartida) se instala
# aparte cuando se necesita (p. ej. `pip install -e ../osap-api`). No se referencia
# aquí por ruta local para no romper el despliegue en servidor.

[project.scripts]
osap-auth-api = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN401", "ANN001", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
